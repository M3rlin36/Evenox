        i.setAttribute('aria-invalid', 'true');

    });

    a.hidden = false;
    var first = fieldInputs(errs[0].name)[0];
    if (first) { first.focus(); }
  }
  function validate(step) {
    var errs = [], d = collect();
    var req = function (name, msg) { if (!radio(name)) { errs.push({ name: name, msg: msg }); } };
    if (step === 1) { req('type_evenement', "Choisissez le type d'événement."); }

      if (!raw && !d.date_flexible) { errs.push({ name: 'date_evenement', msg: 'Indiquez la date, ou cochez « Ma date n\'est pas encore fixée ».' }); }

    }

      if (!d.courriel) { errs.push({ name: 'courriel', msg: 'Indiquez votre courriel.' }); }

  }
  /* ===================== NAVIGATION ===================== */
  function go(n) {

  });
  form.elements.courriel.addEventListener('blur', function () {
    var v = txt('courriel').toLowerCase(), box = $('evxq-suggest'), at = v.lastIndexOf('@');

    $('evxq-suggest-btn').addEventListener('click', function () { form.elements.courriel.value = sug; box.innerHTML = ''; form.elements.courriel.focus(); });
  });
  $('evxq-prev').addEventListener('click', function () { if (state.step > 1 && !state.sending) { go(state.step - 1); } });
  form.addEventListener('submit', function (e) {

    if (state.step < 5) { go(state.step + 1); } else { send(); }
  });
  /* ===================== ENVOI ===================== */
  function buildPayload(d, route, score, consent) {
    var now = new Date(), j = daysUntil(d.date_evenement), a = state.attr;
    var rapprochee = j !== null && j >= 0 && j < 10;
    var hh = offHours();
    var p = {
      form_id: CONFIG.formId, event_id: state.eventId, date_heure_reception: stamp(now), submitted_at: now.toISOString(),
      prenom: d.prenom, nom: d.nom, courriel: d.courriel, telephone: '+1' + d.telephone, telephone_affiche: fmtPhone(d.telephone),
      entreprise: d.entreprise, type_client: d.type_client, type_evenement: d.type_evenement, type_evenement_libelle: (typeInfo(d.type_evenement) || {}).l || '',
      date_evenement: d.date_evenement, date_flexible: d.date_flexible ? 'oui' : 'non', ville: d.ville, type_lieu: d.type_lieu, type_lieu_libelle: labelOf(LIEUX, d.type_lieu),
      nb_invites: d.nb_invites, budget_declare: d.budget, services: d.services.join(' | '), canal_prefere: d.canal_prefere, message: d.message,
      role_decision: d.role_decision, echeance_decision: d.echeance_decision,
      route: route, lead_score: score, lead_qualifie: route === 'A' || route === 'B', lead_value: CONFIG.valeurs[route] || 0, currency: 'CAD',
      temperature: (route === 'A' && d.echeance_decision === "Plus tard / je m'informe") ? 'Tiède' : '',
      date_rapprochee: rapprochee ? 'oui' : 'non', appel_obligatoire: (rapprochee && (route === 'A' || route === 'B')) ? 'oui' : 'non', hors_heures: hh ? 'oui' : 'non',
      etape: (route === 'C' || route === 'D') ? 'Disqualifié' : 'Nouveau',
      raison_perte: route === 'D' ? 'Disqualifié – hors zone' : (route === 'C' ? 'Disqualifié – budget < seuil' : ''),
      consent_marketing: d.consent_marketing ? 'oui' : 'non', consent_mesure: d.consent_mesure ? 'oui' : 'non',
      date_consentement: stamp(now), consent_version: CONFIG.consentVersion, consent_url: location.href, consent_state: consent,
      fbp: consent.ad_storage === 'granted' ? getCookie('_fbp') : '',
      landing_page: a.landing_page || '', referrer: a.referrer || '', forfait_presel: state.preset.forfait || a.forfait || '', variante_hero: a.v || '',
      page_url: location.href, user_agent: navigator.userAgent
    };
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'gclid', 'gbraid', 'wbraid', 'msclkid', 'fbclid', 'oppref'].forEach(function (k) { p[k] = a[k] || ''; });
    return p;
  }
  function msg(html) { var m = $('evxq-msg'); m.innerHTML = '<div class="evxq-msg">' + html + '</div>'; }

    b.disabled = on; b.setAttribute('aria-busy', on ? 'true' : 'false'); b.textContent = on ? 'Envoi en cours…' : submitLabel();
    $('evxq-prev').disabled = on;

  function send() {
    var d = collect(), route = computeRoute(d), score = computeScore(d), consent = getConsent();
    state.attr = readAttr();
    persistAttr(consent);
    setHidden('route', route); setHidden('lead_score', score); setHidden('consent_state', JSON.stringify(consent));
    setHidden('fbp', consent.ad_storage === 'granted' ? getCookie('_fbp') : '');
    var payload = buildPayload(d, route, score, consent);
    if (txt('site_web')) { finish(payload, d, true); return; } /* pot de miel : robot, rien n'est envoyé ni mesuré */
    if (!CONFIG.endpoint) {
      msg('<strong>Votre demande n\'a pas pu être transmise :</strong> ce formulaire n\'est pas encore relié à notre système de réception. Pour obtenir votre soumission dès maintenant, appelez-nous ou textez-nous au ' + telLink() + ', ou écrivez à ' + mailLink() + '.');
      if (window.console) { console.warn('[Évenox] CONFIG.endpoint est vide : aucune donnée envoyée. Voir site/README.md.', payload); }
      return;
    }
    busy(true);
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) { ctl.abort(); } }, CONFIG.delaiEnvoi);
    fetch(CONFIG.endpoint, {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': CONFIG.contentType === 'text/plain' ? 'text/plain;charset=UTF-8' : 'application/json' },
      body: JSON.stringify(payload), signal: ctl ? ctl.signal : undefined
    }).then(function (res) {

      if (!res.ok) { throw new Error('HTTP ' + res.status); }

    }).catch(function (err) {
      clearTimeout(timer); busy(false);
      if (window.console) { console.error('[Évenox] Envoi du formulaire échoué :', err); }
      msg('<strong>L\'envoi n\'a pas fonctionné.</strong> Vos réponses sont conservées : réessayez dans un instant. Si le problème continue, appelez-nous au ' + telLink() + ' ou écrivez à ' + mailLink() + '.');
    });
  }
  function boutiqueLink(route) { return addParams(CONFIG.boutiqueUrl, { utm_source: 'formulaire', utm_medium: 'referral', utm_campaign: route === 'D' ? 'route_d' : 'route_c' }); }
  function calendlyLink(d) {
    if (!CONFIG.calendlyUrl) { return ''; }
    return addParams(CONFIG.calendlyUrl, { name: (d.prenom + ' ' + d.nom).trim(), email: d.courriel, a1: (typeInfo(d.type_evenement) || {}).l || '', a2: d.date_evenement || 'Date à confirmer' });
  }
  function finish(p, d, bot) {
    state.done = true; busy(false); state.sending = true;
    var route = p.route, gone = false;
    var urls = { A: CONFIG.merciAppelUrl, B: CONFIG.merciSoumissionUrl, C: CONFIG.merciBoutiqueUrl, D: CONFIG.merciHorsZoneUrl };

    var leave = function () { if (gone || !target) { return; } gone = true; location.href = target; };

      sessionStorage.setItem('evx_merci', JSON.stringify({ route: route, prenom: d.prenom, nom: d.nom, courriel: d.courriel, type_evenement: d.type_evenement, type_libelle: p.type_evenement_libelle, date_evenement: d.date_evenement, type_client: d.type_client, hors_heures: p.hors_heures, date_rapprochee: p.date_rapprochee, calendly: calendlyLink(d), boutique: (route === 'C' || route === 'D') ? boutiqueLink(route) : '' }));
    } catch (e) { /* ignore */ }

      var ev = { event: 'lead_submit', form_id: CONFIG.formId, lead_route: route, lead_qualifie: route === 'A' || route === 'B', lead_value: CONFIG.valeurs[route] || 0, currency: 'CAD', event_type: d.type_evenement, budget_band: d.budget, event_id: state.eventId };

  }
  function showThanks(route, d, p) {
    var h = '', cal = calendlyLink(d), prenom = esc(d.prenom);

    if (route === 'A') {

      h += p.hors_heures === 'oui' ? '<p>Nos bureaux sont fermés en ce moment : nous vous appelons demain dès 9 h. Vous pouvez aussi choisir votre moment.</p>' : '<p>Un conseiller vous appelle dans les 15 prochaines minutes. Vous préférez choisir le moment de l\'appel?</p>';

      h += '<div class="evxq-actions">' + (cal ? '<a class="evxq-btn" href="' + esc(cal) + '" target="_blank" rel="noopener">Réserver un appel de 15 min</a>' : '') + '<a class="evxq-btn evxq-ghost" href="' + esc(CONFIG.realisationsUrl) + '">Voir nos réalisations</a></div>';
    } else if (route === 'C') {

      h += '<div class="evxq-actions"><a class="evxq-btn" href="' + esc(boutiqueLink('C')) + '">Voir la boutique en ligne</a></div>';

    } else {
      h += '<h3 class="evxq-h" tabindex="-1" id="evxq-thanks-h">Merci ' + prenom + '! Votre lieu est hors de notre zone de livraison.</h3>';
      h += '<p>Nous livrons et installons dans un rayon d\'environ 40 km de Sainte-Thérèse. Bonne nouvelle : vous pouvez réserver dans notre boutique en ligne et ramasser le matériel à notre entrepôt de Sainte-Thérèse.</p>';
      h += '<div class="evxq-actions"><a class="evxq-btn" href="' + esc(boutiqueLink('D')) + '">Voir la boutique en ligne</a></div>';

  /* ===================== DÉMARRAGE ===================== */
  state.attr = readAttr();
  setHidden('event_id', state.eventId);
  HIDDEN.forEach(function (k) { if (['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'gclid', 'gbraid', 'wbraid', 'msclkid', 'fbclid', 'oppref', 'landing_page', 'referrer'].indexOf(k) > -1) { setHidden(k, state.attr[k] || ''); } });
  setHidden('variante_hero', state.attr.v || '');
  var c0 = getConsent(); setHidden('consent_state', JSON.stringify(c0)); setHidden('fbp', c0.ad_storage === 'granted' ? getCookie('_fbp') : ''); persistAttr(c0);

  /* Liens internes « #soumission?forfait=... » : présélection sans rechargement, défilement vers le formulaire. */

})();
