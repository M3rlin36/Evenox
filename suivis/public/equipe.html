<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>L'équipe — Suivi des clients</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body style="overflow:auto">

<div class="cx">
  <div class="cx-boite inst">
    <div class="cx-logo">EVE<span>NOX</span></div>
    <h1>L'équipe</h1>

    <p class="inst-x">
      Qui peut ouvrir le suivi des clients. <b>La personne qui arrive tape son
      code elle-même</b>, ici, devant vous — vous ne le voyez pas, et il n'est
      écrit nulle part.
    </p>

    <div class="cx-err" id="cx-err"></div>
    <div class="eq-ok" id="cx-ok"></div>

    <div class="eq-liste" id="eq-liste">
      <div class="chargement">Chargement…</div>
    </div>

    <form id="form-eq" autocomplete="off">
      <div class="eq-titre">Ajouter quelqu'un</div>
      <div class="inst-r">
        <div class="inst-c"><label for="eq-nom">Nom</label>
          <input type="text" id="eq-nom" class="inst-nom" autocomplete="off"
                 spellcheck="false" maxlength="40" placeholder="Emerik"></div>
        <div class="inst-c"><label for="eq-code">Son code</label>
          <input type="password" id="eq-code" class="inst-code" inputmode="numeric"
                 pattern="[0-9]*" maxlength="12" autocomplete="new-password"
                 placeholder="••••"></div>
        <span></span>
      </div>
      <button class="cx-btn" type="submit" id="eq-btn">Ajouter</button>
    </form>

    <div class="cx-pied">
      <a href="./">← Retour au suivi des clients</a>
    </div>
  </div>
</div>

<script src="js/equipe.js"></script>
</body>
</html>
