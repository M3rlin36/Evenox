<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>Connexion — Suivi des clients</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body style="overflow:auto">

<div class="cx">
  <form class="cx-boite" id="form-cx" autocomplete="on">
    <div class="cx-logo">EVE<span>NOX</span></div>
    <h1>Suivi des clients</h1>

    <div class="cx-err" id="cx-err"></div>

    <div class="cx-champ">
      <label for="code">Votre code</label>
      <!-- inputmode="numeric" fait apparaître le pavé de chiffres sur
           téléphone sans passer par type="number", qui ajouterait des
           petites flèches et mangerait les zéros du début. -->
      <input class="cx-code" type="password" id="code" name="code"
             inputmode="numeric" pattern="[0-9]*" maxlength="12"
             autocomplete="one-time-code" autocapitalize="none"
             spellcheck="false" autofocus required
             aria-describedby="cx-aide">
    </div>

    <button class="cx-btn" type="submit" id="cx-btn">Entrer</button>

    <div class="cx-pied" id="cx-aide">
      Chacun a son propre code.<br>
      Évenox — Sainte-Thérèse, Québec
    </div>
  </form>
</div>

<script src="js/connexion.js"></script>
</body>
</html>
